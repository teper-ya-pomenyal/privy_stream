
services:
  # Пара RSA-ключей для JWT: генерируется при первом запуске, дальше переиспользуется.
  # Ротация: docker compose down && docker volume rm privy_stream_jwt_private privy_stream_jwt_public
  jwt_keys_init:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -s /private/private.pem ] && [ -s /public/public.pem ]; then
          echo "jwt keys: already exist"; exit 0
        fi
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /private/private.pem
        openssl rsa -in /private/private.pem -pubout -out /public/public.pem
        chmod 600 /private/private.pem
        chmod 644 /public/public.pem
        echo "jwt keys: generated"
    volumes:
      - jwt_private:/private
      - jwt_public:/public

  postgres-users:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB_USERS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_USERS}"]
      interval: 5s
      timeout: 5s
      retries: 10

  user_service_migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./user_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-users:5432/${POSTGRES_DB_USERS}?sslmode=disable"
      - "up"
    depends_on:
      postgres-users:
        condition: service_healthy

  postgres-catalog:
    image:
      postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB_CATALOG:-catalog_db}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_CATALOG:-catalog_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog_service_migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./catalog_service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-catalog:5432/${POSTGRES_DB_CATALOG:-catalog_db}?sslmode=disable"
      - "up"
    depends_on:
      postgres-catalog:
        condition: service_healthy

  redis_catalog_cache:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_catalog_cache_data:/data

  redis_users_sessions:
    image: redis:7
    command: redis-server --appendonly yes --requirepass ${USER_CACHE_PASSWORD}

    volumes:
      - redis_users_sessions_data:/data

  catalog_service:
    environment:
      CATALOG_SERVICE_PORT: ${CATALOG_SERVICE_PORT:-50053}
      CATALOG_WRITE_SERVICE_PORT: ${CATALOG_WRITE_SERVICE_PORT:-50056}
      CATALOG_DB_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-catalog:5432/${POSTGRES_DB_CATALOG:-catalog_db}?sslmode=disable"
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    depends_on:
      postgres-catalog:
        condition: service_healthy
      redis_catalog_cache:
        condition: service_started
      catalog_service_migrate:
        condition: service_completed_successfully

  gateway:
    environment:
      PORT: "8080"
      USER_SERVICE_ADDRESS: user_service:${PORT}
      CATALOG_SERVICE_ADDRESS: catalog_service:${CATALOG_SERVICE_PORT:-50053}
      CATALOG_WRITE_SERVICE_ADDRESS: catalog_service:${CATALOG_WRITE_SERVICE_PORT:-50056}
      STREAMING_SERVICE_ADDRESS: streaming_service:${STREAMING_SERVICE_PORT:-50054}
      PUBLIC_KEY_ADDRESS: /keys/public.pem
      TRACK_STORAGE_PATH: /data/tracks
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:1420}
    ports:
    - "8080:8080"
    build:
      context: .
      dockerfile: gateway/Dockerfile
    volumes:
      - jwt_public:/keys:ro
      - tracks_storage:/data/tracks
    depends_on:
      jwt_keys_init:
        condition: service_completed_successfully
      user_service:
        condition: service_started
      catalog_service:
        condition: service_started

  streaming_service:
    environment:
      STREAMING_SERVICE_PORT: ${STREAMING_SERVICE_PORT:-50054}
      CATALOG_SERVICE_ADDRESS: catalog_service:${CATALOG_SERVICE_PORT:-50053}
      CATALOG_WRITE_SERVICE_ADDRESS: catalog_service:${CATALOG_WRITE_SERVICE_PORT:-50056}
      TRACK_STORAGE_PATH: /data/tracks
    build:
      context: .
      dockerfile: streaming_service/Dockerfile
    volumes:
      - tracks_storage:/data/tracks
    depends_on:
      - catalog_service

  user_service:
    environment:
      PORT: ${PORT}
      DB_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-users:5432/${POSTGRES_DB_USERS}?sslmode=disable"
      USER_CACHE_ADDRESS: ${USER_CACHE_ADDRESS}
      USER_CACHE_PASSWORD: ${USER_CACHE_PASSWORD}
      USER_CACHE_NUMBER: ${USER_CACHE_NUMBER}
      USER_CACHE_POOL_SIZE: ${USER_CACHE_POOL_SIZE}
      USER_CACHE_MIN_IDLE_CONNS: ${USER_CACHE_MIN_IDLE_CONNS}
      USER_CACHE_DIAL_TIMEOUT: ${USER_CACHE_DIAL_TIMEOUT}
      USER_CACHE_READ_TIMEOUT: ${USER_CACHE_READ_TIMEOUT}
      USER_CACHE_WRITE_TIMEOUT: ${USER_CACHE_DIAL_TIMEOUT}
      TTL_REFRESH_TIME: ${TTL_REFRESH_TIME}
      TTL_ACCESS_TIME: ${TTL_ACCESS_TIME}
      PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH:-/keys/private.pem}
    build:
      context: .
      dockerfile: user_service/Dockerfile
    volumes:
      - jwt_private:/keys:ro
    depends_on:
      jwt_keys_init:
        condition: service_completed_successfully
      postgres-users:
        condition: service_healthy
      redis_users_sessions:
        condition: service_started
      user_service_migrate:
        condition: service_completed_successfully

volumes:
  jwt_private:
  jwt_public:
  tracks_storage:
  postgres_users_data:
  postgres_catalog_data:
  redis_catalog_cache_data:
  redis_users_sessions_data:
