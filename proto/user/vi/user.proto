syntax = "proto3";
package user.v1;
option go_package = "privy_stream/proto/user/v1;userv1";

service UserService{
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
    string user_name = 1;
    string password = 2;
    string birth_date = 3;
}

message RegisterResponse {
    string user_uuid = 1;
    string access_token = 2;
    string refresh_token = 3;
    string created_at = 4;
    string birth_date = 5;
}


//
message LoginRequest {
    string user_name = 1;
    string password = 2;
}

message LoginResponse {
    string user_uuid = 1;
    string access_token = 2;
    string refresh_token = 3;
    string birth_date = 4;
}