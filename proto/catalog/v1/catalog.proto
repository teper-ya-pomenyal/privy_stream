//

message GetPlaylistByIDRequest {
    string playlist_uuid = 1;
}
message GetPlaylistByIDResponse {
    Playlist playlist = 1;
}

message GetArtistByIDRequest {
    string artist_uuid = 1;
}

message GetArtistByIDResponse {
    Artist artist = 1;
}


//
message GetAlbumByIDRequest {
    string album_uuid = 1;
}

message GetAlbumByIDResponse {
    FullAlbum album = 1;
}
